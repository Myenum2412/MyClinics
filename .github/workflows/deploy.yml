name: Deploy to Server

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 51.21.222.25 >> ~/.ssh/known_hosts

      - name: Sync backend code
        run: |
          rsync -az --delete \
            --exclude node_modules \
            --exclude .env \
            --exclude .env.local \
            --exclude whatsapp-session \
            --exclude .git \
            ./backend/ ubuntu@51.21.222.25:~/myclinics-backend/

      - name: Detect backend changes
        id: changed
        run: |
          BACKEND_CHANGED=$(git diff --name-only HEAD^ HEAD -- backend/ .github/workflows/deploy.yml | head -c1)
          if [ -n "$BACKEND_CHANGED" ]; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install deps and restart services
        run: |
          ssh ubuntu@51.21.222.25 '
            set -e
            cd ~/myclinics-backend
            npm install --no-audit --no-fund
            pm2 startOrRestart ecosystem.config.cjs --only myclinic-backend
            if [ "${{ steps.changed.outputs.backend }}" = "true" ]; then
              pm2 startOrRestart ecosystem.config.cjs --only myclinic-whatsapp || true
            fi
            pm2 save
          '

      - name: Health check
        run: |
          sleep 10
          ssh ubuntu@51.21.222.25 '
            echo "=== Backend PM2 status ==="
            pm2 status myclinic-backend || true
            echo "=== WhatsApp PM2 status ==="
            pm2 status myclinic-whatsapp || true

            echo "=== Waiting for backend API ==="
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:3100/api/clinics/auth/me)
              if [ "$code" = "401" ]; then
                echo "health check OK (attempt $i): backend returned 401 (auth gate up)"
                exit 0
              fi
              echo "attempt $i: HTTP $code — retrying in 3s..."
              sleep 3
            done
            echo "health check failed: backend did not return 401 after 5 attempts"
            exit 1
          '
