name: Deploy to Server

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Configure SSH (keepalive + known hosts)
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # SSH client config — ServerAliveInterval prevents the ~19s idle-drop
          # that kills the connection while npm install is silent
          cat >> ~/.ssh/config << 'SSHCONF'
          Host deploy-server
            HostName 51.21.222.25
            User ubuntu
            ServerAliveInterval 15
            ServerAliveCountMax 10
            ConnectTimeout 30
            StrictHostKeyChecking no
          SSHCONF
          chmod 600 ~/.ssh/config

          # Also populate known_hosts as a belt-and-braces fallback
          ssh-keyscan -T 30 -H 51.21.222.25 >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 644 ~/.ssh/known_hosts

      - name: Sync backend code
        run: |
          rsync -az --delete \
            -e "ssh -F ~/.ssh/config" \
            --exclude node_modules \
            --exclude .env \
            --exclude .env.local \
            --exclude whatsapp-session \
            --exclude .git \
            ./backend/ deploy-server:~/myclinics-backend/

      - name: Detect backend changes
        id: changed
        run: |
          BACKEND_CHANGED=$(git diff --name-only HEAD^ HEAD -- backend/ .github/workflows/deploy.yml | head -c1)
          if [ -n "$BACKEND_CHANGED" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps and restart services
        env:
          BACKEND_CHANGED: ${{ steps.changed.outputs.backend }}
        run: |
          ssh deploy-server "BACKEND_CHANGED=$BACKEND_CHANGED bash -s" << 'ENDSSH'
            set -e
            cd ~/myclinics-backend
            echo "→ npm install"
            npm install --no-audit --no-fund
            echo "→ restarting myclinic-backend"
            pm2 startOrRestart ecosystem.config.cjs --only myclinic-backend
            if [ "$BACKEND_CHANGED" = "true" ]; then
              echo "→ restarting myclinic-whatsapp"
              pm2 startOrRestart ecosystem.config.cjs --only myclinic-whatsapp || true
            fi
            pm2 save
            echo "→ done"
          ENDSSH

      - name: Health check
        run: |
          sleep 10
          ssh deploy-server bash -s << 'ENDSSH'
            echo "=== Backend PM2 status ==="
            pm2 status myclinic-backend || true
            echo "=== WhatsApp PM2 status ==="
            pm2 status myclinic-whatsapp || true

            echo "=== Waiting for backend API ==="
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 http://127.0.0.1:3100/api/clinics/auth/me)
              if [ "$code" = "401" ]; then
                echo "health check OK (attempt $i): backend returned 401 (auth gate up)"
                exit 0
              fi
              echo "attempt $i: HTTP $code — retrying in 5s..."
              sleep 5
            done
            echo "health check failed: backend did not return 401 after 5 attempts"
            exit 1
          ENDSSH
