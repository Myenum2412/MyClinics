name: Auto Deploy (Cloudflare + AWS)
on:
  push:
    branches: [main]

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deploy workflow — Cloudflare handles frontend; backend requires AWS/EC2 secrets to run."

  cloudflare-frontend:
    runs-on: ubuntu-latest
    # Skipped if CLOUDFLARE_API_TOKEN missing (e.g. if using Cloudflare's native GitHub integration)
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Build Cloudflare worker bundle
        run: npm run build:cloudflare -w frontend
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'frontend'
          command: deploy

  backend-aws:
    runs-on: ubuntu-latest
    # Runs via AWS SSM — no inbound SSH needed, uses IAM role on EC2
    if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' || secrets.AWS_ACCESS_KEY_ID != '' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy backend via SSM
        run: |
          INSTANCE_ID=${{ secrets.AWS_EC2_INSTANCE_ID }}
          # Fallback: resolve instance ID from IP if not set
          if [ -z "$INSTANCE_ID" ]; then
            INSTANCE_ID=$(aws ec2 describe-instances --filters "Name=ip-address,Values=${{ secrets.EC2_HOST }}" --query "Reservations[0].Instances[0].InstanceId" --output text)
          fi
          echo "Deploying to $INSTANCE_ID"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"cd /home/ubuntu/myclinics-backend 2>/dev/null || cd ~/MyClinics/backend\",\"git pull origin main\",\"npm ci 2>/dev/null || npm install\",\"pm2 reload ecosystem.config.cjs --env production --update-env || pm2 start ecosystem.config.cjs --env production\",\"pm2 save\",\"pm2 status\"]" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"
          aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query "StandardOutputContent" --output text | tail -n 100

  backend-ssh-fallback:
    runs-on: ubuntu-latest
    if: ${{ secrets.EC2_HOST != '' && secrets.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID == '' }}
    steps:
      - name: Deploy backend via SSH (fallback)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/myclinics-backend 2>/dev/null || cd ~/MyClinics
            git pull origin main
            npm ci --prefix backend || npm install --prefix backend
            pm2 reload ecosystem.config.cjs --env production --update-env || pm2 start ecosystem.config.cjs --env production
            pm2 save
